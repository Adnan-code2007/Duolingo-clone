    <script>
      // Provide a setter for window.fetch in iframe / sandbox environments
      // where Window.prototype.fetch only has a getter.
      (function() {
        try {
          let currentFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            Object.defineProperty(Window.prototype, 'fetch', {
              writable: true,
              configurable: true
            });
          } catch (_) {}
        }
      })();
    </script>
